<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帳戶｜企業雲端商機洞察平台</title>
<meta name="description" content="帳戶分數、訊號證據、營收動能與 Copilot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=20261019b">
<link rel="stylesheet" href="css/app.css?v=20261019h">
</head>
<body data-page="account" data-title="帳戶">
<main>
  <header class="acct-head" id="head"></header>

  <div class="acct-grid">
    <div class="acct-left">
      <!-- 上半部（09 檔 5.2）：業務速覽——結論、分數摘要、BANT 預審、開場白與問題 -->
      <section class="lk-verdict" id="acct-verdict" aria-label="結論"></section>
      <!-- 列 A：Tier 主卡 -->
      <section class="card dark tier-strip" id="tier-card" aria-label="帳戶摘要"></section>
      <section class="acct-quick">
        <div class="card" id="acct-bant"></div>
        <div class="card" id="acct-say"></div>
      </section>

      <!-- 下半部：深度分析 -->
      <h2 class="acct-divider" id="deep">深度分析</h2>

      <!-- 列 B：Need 拆解｜Timing 拆解 -->
      <div class="b-legend" aria-label="圖例"><span><i class="i-over"></i>高於帳戶池中位數</span><span><i class="i-under"></i>未達中位數</span><span><i class="i-med"></i>帳戶池中位數</span><span><i class="i-miss"></i>無資料（不算 0 分）</span></div>
      <section class="b-row">
        <div class="card" id="b-need"></div>
        <div class="card" id="b-timing"></div>
      </section>

      <!-- 列 C：訊號時間軸 -->
      <section class="card">
        <div class="card-head"><h2 id="c-title">訊號時間軸</h2><span class="hint">形狀＝Play・大小＝得分・點擊看清單</span></div>
        <div class="card-body chart-pad"><div id="swim"></div>
          <div class="legend" id="swim-legend"></div></div>
      </section>

      <!-- 列 D：營收動能 -->
      <section class="card">
        <div class="card-head"><h2 id="d-title">營收動能</h2><span class="hint">上：年增率（虛線＝±15%）・下：月營收</span></div>
        <div class="card-body chart-pad"><div id="control"></div></div>
      </section>

      <!-- 列 E：Play 組成｜同產業排名 -->
      <section class="e-row">
        <div class="card">
          <div class="card-head"><h2 id="e-title">Play 組成</h2></div>
          <div class="card-body"><div id="stack"></div><p class="mini-note left" id="e-note"></p></div>
        </div>
        <div class="card">
          <div class="card-head head-split"><div><h2 id="rank-title">同產業排名</h2><span class="hint" id="rank-pr"></span></div>
            <div class="seg-toggle" role="group" aria-label="排名依據" id="metric-seg"><button type="button" data-metric="need" aria-pressed="true">Need</button><button type="button" data-metric="timing" aria-pressed="false">Timing</button></div></div>
          <div class="seg-toggle scope-seg" role="group" aria-label="比較範圍" id="scope-seg"><button type="button" data-scope="industry" aria-pressed="true">同產業</button><button type="button" data-scope="size" aria-pressed="false">同規模</button><button type="button" data-scope="pool" aria-pressed="false">帳戶池</button></div>
          <div class="card-body"><div id="rank"></div></div>
        </div>
      </section>

      <!-- 雲端現況與同業證明｜建議接觸職稱與 MEDDPICC 缺口 -->
      <section class="e-row">
        <div class="card" id="acct-proof"></div>
        <div class="card" id="acct-meddpicc"></div>
      </section>

      <!-- 會議準備包 -->
      <section class="card" id="acct-pack" aria-labelledby="pack-title"></section>

      <!-- 列 F：訊號清單 -->
      <section class="card">
        <div class="card-head"><h2>訊號清單</h2><span class="hint" id="f-hint"></span></div>
        <div class="card-body"><ul class="siglist" id="siglist"></ul>
          <button type="button" class="btn-secondary" id="toggle-all"></button></div>
      </section>
    </div>

    <aside class="copilot-col">
      <section class="copilot" aria-label="Copilot" id="copilot"></section>
    </aside>
  </div>
</main>

<script src="js/api.js?v=20261019b"></script>
<script src="js/shell.js?v=20261019e"></script>
<script src="js/lead.js?v=20261019c"></script>
<script src="js/charts.js?v=20261014r"></script>
<script src="js/account-charts.js?v=20261014r"></script>
<script src="js/copilot.js?v=20261014r"></script>
<script>
(async () => {
  const { LABELS, COMPONENTS, fmt, esc, tierBadge, ageDays } = CL;
  const d = await CL.load();
  const code = new URLSearchParams(location.search).get('code');
  const c = d.byCode[code];
  if (!c || !c.score) { document.getElementById('head').innerHTML = '<h1>查無此帳戶</h1>'; return; }
  const s = c.score, sig = c.signals, docs = c.docs;
  const pool = d.pool || { median: {} };
  const fin = c.industry === '金融保險', otc = c.market === '上櫃';
  document.title = `${c.name} ${c.code}｜企業雲端商機洞察平台`;
  const by = (type, cat) => sig.filter(x => x.type === type && (!cat || x.cat === cat));
  const rows = d.accounts.map(a => ({ code: a.code, name: a.name, industry: a.industry, need: Number(a.score.need) || 0, timing: Number(a.score.timing) || 0, play: a.score.play_primary }));
  const self = rows.find(r => r.code === code);

  document.getElementById('head').innerHTML = `
    <div><h1>${esc(c.name)} <span style="font-weight:400">${c.code}</span></h1>
      <div class="sub">${esc(c.full)}・${esc(c.industry)}・${c.market}・實收資本額 ${(c.capital / 1e8).toFixed(0)} 億元</div></div>
    <div class="head-right"><div class="tags">${tierBadge(String(s.tier))}
      ${s.cloud_status === 'unknown' ? '' : `<span class="badge cloud">${LABELS.cloud[s.cloud_status]}</span>`}</div>
      <div class="acct-actions no-print">
        <button type="button" class="lk-act btn-dark" id="act-handoff">複製轉交摘要</button>
        <button type="button" class="lk-act lk-watch" id="act-watch"></button>
        <button type="button" class="lk-act lk-link" id="act-print">匯出帳戶簡報</button>
      </div></div>`;

  // ---------- A 帳戶摘要 ----------
  const maxOf = k => k === 'n4' && otc ? 15 : COMPONENTS.find(x => x.key === k).max;
  // 黑色 Tier 主卡：帳戶池排名（Need＋Timing 總分，同分並列）
  const poolRank = s.pool_rank || (rows.slice().sort((a, b) => (b.need + b.timing) - (a.need + a.timing)).findIndex(r => r.code === code) + 1);
  const tierName = LABELS.tierLong[String(s.tier)];
  const tl = String(s.tier) === 'hold' ? '暫緩' : 'Tier ' + s.tier;
  const playLine = s.play_primary === CL.NO_PLAY ? CL.NO_PLAY : esc(s.play_primary) + (s.play_secondary ? '・' + esc(s.play_secondary) : '');
  document.getElementById('tier-card').innerHTML = `
    <div class="ts-item"><span class="ts-label">帳戶池排名</span><span class="ts-big">#${poolRank}<span class="ts-of"> / ${rows.length}</span></span></div>
    <div class="ts-item"><span class="ts-label">優先級</span><span class="ts-big">${tl}</span><span class="ts-note">${esc(tierName.replace(/^Tier \d\s*/, ''))}</span></div>
    <div class="ts-item"><span class="ts-label">建議 Play</span><span class="ts-big">${playLine}</span></div>`;
  // 比較範圍（09 檔 5.2）：同產業／同規模（實收資本額同級距）／帳戶池，顯示 PR 值
  const band = cap => cap >= 1e10 ? 4 : cap >= 1e9 ? 3 : cap >= 1e8 ? 2 : 1;
  const capOf = {};
  d.accounts.forEach(a => { capOf[a.code] = Number(a.capital) || 0; });
  const SCOPE = { industry: ['同產業', r => r.industry === c.industry], size: ['同規模', r => band(capOf[r.code]) === band(Number(c.capital) || 0)], pool: ['帳戶池', () => true] };
  let metricNow = 'need', scopeNow = 'industry';
  const drawRank = () => {
    const [label, fn] = SCOPE[scopeNow];
    const peers = rows.filter(fn);
    const rank = AC.lollipop(document.getElementById('rank'), { peers, selfCode: code, metric: metricNow });
    const me = self[metricNow], prv = Math.round(peers.filter(r => r[metricNow] <= me).length / peers.length * 100);
    document.getElementById('rank-title').textContent = `${label} ${peers.length} 家中排第 ${rank}`;
    document.getElementById('rank-pr').textContent = `${metricNow === 'need' ? 'Need' : 'Timing'} ${fmt(me)}・${label} PR ${prv}`;
    document.querySelectorAll('#metric-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.metric === metricNow)));
    document.querySelectorAll('#scope-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.scope === scopeNow)));
  };
  document.querySelectorAll('#metric-seg button').forEach(b => b.addEventListener('click', () => { metricNow = b.dataset.metric; drawRank(); }));
  document.querySelectorAll('#scope-seg button').forEach(b => b.addEventListener('click', () => { scopeNow = b.dataset.scope; drawRank(); }));
  drawRank();

  // ---------- 上半部：結論、BANT、開場白；下半部：同業證明、接觸職稱、MEDDPICC、會議準備包 ----------
  window.__runId = d.run_id;
  const cfg = await Lead.loadConfig();
  const lp = Lead.profileFromAccount(c);
  const seg = Lead.route(cfg.routing, { capital: lp.capital, listed: true });
  const qs = Lead.QUESTIONS[lp.play] || Lead.QUESTIONS.none;
  const bnt = Lead.bant(lp, cfg), open = Lead.opening(lp), handoffText = Lead.handoff(lp, seg, bnt, qs);
  const packMd = Lead.meetingPack(lp, seg, cfg, d);
  document.getElementById('acct-verdict').className = 'lk-verdict v-' + lp.verdict.key;
  document.getElementById('acct-verdict').innerHTML = `<div class="lk-v-main"><span class="lk-v-label">${esc(lp.verdict.label)}</span><span class="lk-v-seg">建議分群：${esc(seg || '—')}</span></div>
    <p class="lk-v-reason">${esc(lp.verdict.reason)}</p>`;
  document.getElementById('acct-bant').innerHTML = `<div class="card-head"><h2>BANT 預審</h2><span class="hint">系統推估＝公開資料可支持；待確認＝需在通話中確認</span></div>
    <ul class="lk-bant">${bnt.map(r => `<li><div class="lk-b-key">${esc(r.key)}</div><div class="lk-b-body"><div class="lk-b-label">${esc(r.label)}</div><div>${esc(r.text)}</div></div>
      <span class="lk-state ${r.state}">${Lead.STATE[r.state]}</span></li>`).join('')}</ul>`;
  document.getElementById('acct-say').innerHTML = `<div class="card-head"><h2>怎麼開口</h2><span class="hint">依觸發事件與主要 Play 由規則產生</span></div>
    <div class="lk-say"><p>${esc(open)}</p><button type="button" class="lk-copy" data-text="open">複製</button></div>
    <ol class="lk-qs">${qs.map((q, i) => `<li><span>${esc(q)}</span><button type="button" class="lk-copy" data-text="q${i}">複製</button></li>`).join('')}</ol>`;
  const texts = { open, handoff: handoffText, pack: packMd };
  qs.forEach((q, i) => { texts['q' + i] = q; });
  document.querySelectorAll('[data-text]').forEach(b => b.addEventListener('click', () => Lead.copy(texts[b.dataset.text], b)));

  // 雲端現況與同業證明
  const vendor = docs.filter(x => x.parts.some(p => p.type === 'VENDOR'));
  const proof = Lead.peerProof(lp, d);
  document.getElementById('acct-proof').innerHTML = `<div class="card-head"><h2>雲端現況與同業證明</h2><span class="hint">只列公開來源；同產業優先、AWS 優先</span></div>
    <p class="proof-now"><b>本公司：</b>${esc(LABELS.cloud[s.cloud_status] || '未知')}${vendor.length ? `（依據：${vendor.slice(0, 2).map(x => `<span class="ref" data-ref="${x.ref}" tabindex="0">[${x.ref}]</span>`).join('')}）` : '・公開資料中沒有雲端廠商線索'}</p>
    <ul class="proof-list">${proof.length ? proof.slice(0, 5).map(x => `<li><span class="badge ${x.aws ? 'tier-1' : 'cloud'}">${esc(x.cloud)}</span>
      <a href="account.html?code=${esc(x.code)}">${esc(x.name)}</a><span class="muted">${esc(x.sameInd ? '同產業' : '')}${x.samePlay ? (x.sameInd ? '・' : '') + '同 Play' : ''}</span>
      ${x.url ? `<a class="src-link" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.src || '來源')}</a>` : `<span class="muted">${esc(x.src || '')}</span>`}</li>`).join('')
      : '<li class="muted">驗證集中沒有同產業或同 Play 的公開雲端案例</li>'}</ul>`;

  // 建議接觸職稱＋MEDDPICC 缺口
  const md = Lead.meddpicc(lp);
  document.getElementById('acct-meddpicc').innerHTML = `<div class="card-head"><h2>建議接觸職稱與 MEDDPICC 缺口</h2><span class="hint">不放人名；缺口＝公開資料無法回答，需在會議中確認</span></div>
    <div class="roles">${Lead.contactRoles(lp).map(r => `<span class="role-chip">${esc(r)}</span>`).join('')}</div>
    <ul class="med-list">${md.map(m => `<li class="${m.ok ? 'ok' : 'gap'}"><span class="med-k">${m.k}</span><div><div class="med-n">${esc(m.name)}<span class="lk-state ${m.ok ? 'estimated' : 'pending'}">${m.ok ? '有線索' : '缺口'}</span></div>
      <div class="med-t">${esc(m.ok ? m.have : m.ask)}</div></div></li>`).join('')}</ul>`;

  // 會議準備包
  document.getElementById('acct-pack').innerHTML = `<div class="card-head head-split"><div><h2 id="pack-title">會議準備包</h2><span class="hint">議程、Discovery 問題、異議回應、同業證明、MEDDPICC 缺口；匯出 Markdown 貼進會議資料或 CRM</span></div>
      <div class="pack-actions no-print"><button type="button" class="lk-copy" data-text="pack">複製 Markdown</button><button type="button" class="lk-copy" id="pack-dl">下載 .md</button></div></div>
    <pre class="pack-pre">${esc(packMd)}</pre>`;
  document.querySelector('#acct-pack [data-text]').addEventListener('click', e => Lead.copy(packMd, e.currentTarget));
  document.getElementById('pack-dl').addEventListener('click', () => Lead.download(`${c.name}_會議準備包_${new Date().toISOString().slice(0, 10)}.md`, packMd));

  // 頁首動作：轉交摘要、觀察清單、列印
  document.getElementById('act-handoff').addEventListener('click', e => Lead.copy(handoffText, e.currentTarget));
  const wb = document.getElementById('act-watch');
  const paintW = () => { const on = Lead.inWatch(lp.key); wb.textContent = on ? '已在觀察清單' : '加入觀察清單'; wb.setAttribute('aria-pressed', String(on)); };
  wb.addEventListener('click', () => { Lead.toggleWatch(lp); paintW(); });
  paintW();
  document.getElementById('act-print').addEventListener('click', () => window.print());

  // ---------- B 分數拆解（子彈圖＋帳戶池中位數） ----------
  const refs = list => {
    const uniq = [...new Set(list.map(x => x.ref))];
    return uniq.slice(0, 3).map(r => `<span class="ref" data-ref="${r}" tabindex="0">[${r}]</span>`).join('') +
      (uniq.length > 3 ? `<span class="more" data-tip="${uniq.slice(3).map(r => '[' + r + ']').join(' ')}" tabindex="0">＋${uniq.length - 3}</span>` : '');
  };
  const REASON = {
    D18: '台灣就業通公開職缺資料僅 1,000 筆且集中台北市，招募項目停用，移出分母（決策 D18）',
    D27: '金融保險業營收受投資收益波動，不代表擴張或降本，營收動能不納入計分（決策 D27）',
    D19: '櫃買中心沒有 ESG 資訊安全揭露，N4 的 ESG 子項移出分母（滿分改 15，決策 D19）'
  };
  const last12 = c.revenue.slice(-12);
  const docsOf = list => [...new Set(list.map(x => x.ref))].length;
  function line(k) {
    switch (k) {
      case 'n1': return last12.length >= 6 ? `近 12 月營收 ${Math.round(last12.reduce((a, r) => a + r[1], 0) / 1e5).toLocaleString()} 億，池內第 ${Math.round(Number(s.n1) / 25 * 100)} 百分位` : '月營收不足 6 個月，以實收資本額百分位代理';
      case 'n3': return docsOf(by('N3')) ? `近 365 天 ${docsOf(by('N3'))} 份文件命中遷移／數據／AI 字典` : '近 365 天沒有命中策略字典';
      case 'n4': {
        const p = [];
        if (fin) p.push('金融業基礎 10');
        if (by('N4', 'esg_breach').length) p.push('ESG 外洩 +10');
        if (by('N4', 'incident').length) p.push('資安事件重訊 +15');
        return p.length ? p.join('・') : (otc ? '無資安事件（上櫃無 ESG 揭露）' : '無 ESG 外洩、無資安事件重訊');
      }
      case 't1': { const n = docsOf(by('T1').filter(x => ageDays(x.at, d.generated_at) <= 90)); return n ? `近 90 天 ${n} 份觸發事件重訊` : '近 90 天沒有觸發事件'; }
      case 't2': { const e = by('T2'); return e.length ? e[0].title : '近 30 天命中新聞未達月均 1.5 倍'; }
      case 't3': { const e = by('T3'); return e.length ? e[0].title : '近 3 個月 YoY 未連續超過 ±15%'; }
    }
    return '';
  }
  const RULE = {
    n1: '近 12 個月營收在帳戶池內的百分位 × 25（無營收者以實收資本額代理）',
    n3: '近 365 天重訊＋新聞命中字典的文件數 n（強 1、弱 0.5），得分 25 × (1 − 0.5ⁿ)',
    n4: '金融業基礎 10；ESG 揭露外洩 > 0 加 10；近 365 天資安事件重訊加 15；上限 25',
    t1: '重訊主旨命中觸發事件，依類型給分 × 時間衰減（30 天內 ×1、31–90 天 ×0.5），上限 50',
    t2: '近 30 天命中新聞 ÷ 過去 90 天月均：≥ 2 倍滿分、≥ 1.5 倍一半（至少 2 則）',
    t3: '連 3 個月 YoY > +15% → 20（擴張）；< −15% → 15（降本）'
  };
  const evid = { n1: [], n3: by('N3'), n4: by('N4'), t1: by('T1').filter(x => ageDays(x.at, d.generated_at) <= 90), t2: by('T2'), t3: by('T3') };
  const bullet = x => {
    const v = s[x.key], miss = v === '', mx = maxOf(x.key), med = pool.median[x.key];
    const reason = x.key === 'n2' || x.key === 't4' ? 'D18' : x.key === 't3' && fin ? 'D27' : '';
    const medPct = med === null || med === undefined ? null : Math.min(100, med / mx * 100);
    return `<div class="bul">
      <div class="bul-name">${x.name}${x.key === 'n4' && otc ? ` <span class="code" data-tip="${esc(REASON.D19)}" tabindex="0">D19</span>` : ''}</div>
      <div class="bul-track${miss ? ' missing' : ''}" data-tip="${esc(miss ? REASON[reason] || '無資料' : RULE[x.key] || '')}">
        ${miss ? '' : `<i class="${med !== null && med !== undefined && Number(v) >= med ? 'over' : ''}" style="width:${Number(v) / mx * 100}%"></i>`}
        ${!miss && medPct !== null ? `<b class="med" style="left:${medPct}%"></b>` : ''}
      </div>
      <div class="bul-val">${miss ? `<span class="muted">無資料</span> <span class="code" data-tip="${esc(REASON[reason] || '')}" tabindex="0">${reason}</span>` : `<b>${fmt(v)}</b> <span class="muted">/ ${mx}</span>`}</div>
      <div class="bul-line">${miss ? '' : esc(line(x.key))} ${miss ? '' : refs(evid[x.key] || [])}${!miss && med !== null && med !== undefined ? `<span class="mid">中位 ${fmt(med)}</span>` : ''}</div>
    </div>`;
  };
  const axisCard = ax => `
    <div class="axis-title"><div><h2>${ax === 'need' ? 'Need 需求強度' : 'Timing 時機'}</h2></div>
      <span class="score">${fmt(s[ax])}<span class="muted" style="font-size:13px;font-weight:400"> / 100</span></span></div>
    ${COMPONENTS.filter(x => x.axis === ax).map(bullet).join('')}`;
  document.getElementById('b-need').innerHTML = axisCard('need');
  document.getElementById('b-timing').innerHTML = axisCard('timing');

  // ---------- C 泳道點圖 ----------
  const recent = docs.filter(x => ageDays(x.at, d.generated_at) <= 365);
  const t1n = docsOf(by('T1').filter(x => ageDays(x.at, d.generated_at) <= 30));
  document.getElementById('c-title').textContent = recent.length
    ? `近一年 ${recent.length} 份訊號${t1n ? `，近 30 天有 ${t1n} 份觸發事件` : ''}` : '近一年沒有訊號';
  AC.swimlane(document.getElementById('swim'), { docs: recent, refDate: d.generated_at, onPick: ref => pick(ref) });
  document.getElementById('swim-legend').innerHTML = ['Migration', 'Data', 'GenAI', 'Security'].map(p => `<span>${CL.shapeSvg(p, 11)}${LABELS.playShort[p]}</span>`).join('') +
    `<span><svg width="11" height="11" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4.5" fill="var(--white)" stroke="var(--ink-500)" stroke-width="1.5"/></svg>無 Play（營收、新聞量）</span>`;

  // ---------- D 營收管制圖 ----------
  const rv = c.revenue.slice(-15);
  document.getElementById('d-title').textContent = fin ? '金融業營收受投資收益影響，不納入計分（D27）'
    : s.t3 === '' ? '月營收不足 3 個月，營收動能無資料'
    : Number(s.t3) === 20 ? '連 3 月 YoY > +15% → T3 拿滿 20 分'
    : Number(s.t3) === 15 ? '連 3 月 YoY < −15% → T3 15 分（降本話術）'
    : '未連續超過 ±15% 門檻 → T3 0 分';
  AC.control(document.getElementById('control'), { rows: rv, applicable: !fin });

  // ---------- E Play 組成 ----------
  const ps = s.play_scores || null;
  if (ps) {
    const tot = Object.values(ps).reduce((a, b) => a + b, 0) || 1;
    const pc = p => Math.round(ps[p] / tot * 100);
    document.getElementById('e-title').innerHTML = `<span class="ln">主 Play：${esc(s.play_primary)}（${pc(s.play_primary)}%）</span>` + (s.play_secondary ? `<span class="ln">次 Play：${esc(s.play_secondary)}（${pc(s.play_secondary)}%）</span>` : '<span class="ln">無次 Play</span>');
    AC.playStack(document.getElementById('stack'), { scores: ps });
    document.getElementById('e-note').textContent = '';
  } else document.getElementById('stack').innerHTML = '<p class="empty">Play 分數將於下次 API 更新後顯示</p>';

  // ---------- F 訊號清單 ----------
  const byPts = docs.slice().sort((a, b) => b.points - a.points || String(b.at).localeCompare(String(a.at)));
  let expanded = false;
  const SRC = { ann: '重大訊息', news: '新聞', esg: 'ESG 報告', revenue: '月營收' };
  function renderList() {
    const list = expanded ? byPts : byPts.slice(0, 5);
    document.getElementById('f-hint').textContent = `依得分排序・${expanded ? '全部' : '前 5'} / ${docs.length}`;
    document.getElementById('siglist').innerHTML = list.length ? list.map(x => {
      const ext = x.url && x.url[0] !== '#';
      const label = x.src === 'ann' ? `${esc(x.title)}` : esc(x.title);
      const title = x.url ? `<a href="${esc(x.url)}"${ext ? ' target="_blank" rel="noopener"' : ''}>${label}</a>` : label;
      return `<li id="${x.ref}" data-ref="${x.ref}"><span class="pdot">${x.play && CL.PLAY_SHAPE[x.play] ? CL.shapeSvg(x.play, 10) : '<svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="var(--white)" stroke="var(--ink-500)" stroke-width="1.5"/></svg>'}</span>
        <span class="sid">${x.ref}</span><span class="date">${String(x.at).slice(0, 10)}</span><span class="type">${SRC[x.src] || x.src}</span>
        <span>${title}<br><span class="kinds">${x.kinds.join('　')}・得分 ${fmt(x.points)}</span></span></li>`;
    }).join('') : '<li class="muted">沒有訊號</li>';
    const btn = document.getElementById('toggle-all');
    btn.hidden = docs.length <= 5;
    btn.textContent = expanded ? '收合' : `顯示全部 ${docs.length} 則`;
    hookRefs(document.getElementById('siglist'));
  }
  document.getElementById('toggle-all').addEventListener('click', () => { expanded = !expanded; renderList(); });

  // [S#] 互動：hover 高亮、點擊捲到清單（清單收合時自動展開）
  const setOn = (ref, on) => document.querySelectorAll(`[data-ref="${ref}"]`).forEach(n => n.classList.toggle('on', on));
  // 同步高亮泳道圖上對應的點（放大並加外框）
  const swimPt = (ref, on) => document.querySelectorAll(`#swim [data-pt="${ref}"]`).forEach(n => n.classList.toggle('pt-on', on));
  function pick(ref) {
    if (!document.getElementById(ref)) { expanded = true; renderList(); }
    const t = document.getElementById(ref);
    if (!t) return;
    document.querySelectorAll('.siglist li.picked').forEach(n => n.classList.remove('picked'));
    t.classList.add('picked');
    t.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function hookRefs(scope) {
    scope.querySelectorAll('[data-ref]').forEach(n => {
      if (n.__hooked) return; n.__hooked = true;
      n.addEventListener('mouseenter', () => { setOn(n.dataset.ref, true); swimPt(n.dataset.ref, true); });
      n.addEventListener('mouseleave', () => { setOn(n.dataset.ref, false); swimPt(n.dataset.ref, false); });
    });
    scope.querySelectorAll('.ref').forEach(n => {
      if (n.__click) return; n.__click = true;
      n.addEventListener('click', () => pick(n.dataset.ref));
      n.addEventListener('keydown', e => { if (e.key === 'Enter') pick(n.dataset.ref); });
    });
  }
  renderList();
  hookRefs(document);
  AC.bindTips(document.getElementById('b-need'));
  AC.bindTips(document.getElementById('b-timing'));
  Copilot.mount(document.getElementById('copilot'), c.code, hookRefs);
})();
</script>
</body>
</html>
