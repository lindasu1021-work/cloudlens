<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帳戶｜企業雲端商機洞察平台</title>
<meta name="description" content="帳戶分數、訊號證據、營收動能與 Copilot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=20261014i">
<link rel="stylesheet" href="css/app.css?v=20261014i">
</head>
<body data-page="account" data-title="帳戶">
<main>
  <header class="acct-head" id="head"></header>

  <div class="acct-grid">
    <div class="acct-left">
      <!-- 列 A：黑色 Tier 主卡｜Need 計量圖｜Timing 計量圖｜迷你象限圖 -->
      <section class="a-row" aria-label="分數摘要">
        <div class="card dark tier-card" id="tier-card"></div>
        <div class="card mini"><h2 class="mini-h">Need 需求強度</h2><div id="g-need" class="gauge"></div><p class="mini-note" id="g-need-note"></p></div>
        <div class="card mini"><h2 class="mini-h">Timing 時機</h2><div id="g-timing" class="gauge"></div><p class="mini-note" id="g-timing-note"></p></div>
        <div class="card mini"><h2 class="mini-h" id="q-title">帳戶池位置</h2><div id="mini-quad"></div><p class="mini-note" id="q-note"></p></div>
      </section>

      <!-- 列 B：Need 拆解｜Timing 拆解 -->
      <div class="b-legend" aria-label="圖例"><span><i class="i-over"></i>高於帳戶池中位數</span><span><i class="i-under"></i>未達中位數</span><span><i class="i-med"></i>帳戶池中位數</span><span><i class="i-miss"></i>無資料（不算 0 分）</span></div>
      <section class="b-row">
        <div class="card" id="b-need"></div>
        <div class="card" id="b-timing"></div>
      </section>

      <!-- 列 C：訊號時間軸 -->
      <section class="card">
        <div class="card-head"><h2 id="c-title">訊號時間軸</h2><span class="hint">顏色＋形狀＝Play・大小＝得分・點擊看下方清單；背景色帶＝時間衰減</span></div>
        <div class="card-body chart-pad"><div id="swim"></div>
          <div class="legend" id="swim-legend"></div></div>
      </section>

      <!-- 列 D：營收動能 -->
      <section class="card">
        <div class="card-head"><h2 id="d-title">營收動能</h2><span class="hint">上：年增率（虛線＝±15% 門檻）・下：月營收，最新 3 個月為 T3 判斷區間</span></div>
        <div class="card-body chart-pad"><div id="control"></div></div>
      </section>

      <!-- 列 E：Play 組成｜同產業排名 -->
      <section class="e-row">
        <div class="card">
          <div class="card-head"><h2 id="e-title">Play 組成</h2><span class="hint">各 Play 分數占比（含產業先驗各 +5）</span></div>
          <div class="card-body"><div id="stack"></div><p class="mini-note left" id="e-note"></p></div>
        </div>
        <div class="card">
          <div class="card-head head-split"><div><h2 id="rank-title">同產業排名</h2><span class="hint">前 10 名＋本公司</span></div>
            <div class="seg-toggle" role="group" aria-label="排名依據"><button type="button" data-metric="need" aria-pressed="true">Need</button><button type="button" data-metric="timing" aria-pressed="false">Timing</button></div></div>
          <div class="card-body"><div id="rank"></div></div>
        </div>
      </section>

      <!-- 列 F：訊號清單 -->
      <section class="card">
        <div class="card-head"><h2>訊號清單</h2><span class="hint" id="f-hint"></span></div>
        <div class="card-body"><ul class="siglist" id="siglist"></ul>
          <button type="button" class="btn-secondary" id="toggle-all"></button></div>
      </section>
    </div>

    <aside class="copilot-col">
      <section class="copilot" aria-label="Copilot" id="copilot"></section>
    </aside>
  </div>
</main>
<footer>資料來源：臺灣證券交易所、證券櫃檯買賣中心、公開資訊觀測站、Google News。不蒐集個人姓名或聯絡方式。</footer>

<script src="js/api.js?v=20261014i"></script>
<script src="js/shell.js?v=20261014i"></script>
<script src="js/charts.js?v=20261014i"></script>
<script src="js/account-charts.js?v=20261014i"></script>
<script src="js/copilot.js?v=20261014i"></script>
<script>
(async () => {
  const { LABELS, COMPONENTS, fmt, esc, tierBadge, ageDays } = CL;
  const d = await CL.load();
  const code = new URLSearchParams(location.search).get('code');
  const c = d.byCode[code];
  if (!c || !c.score) { document.getElementById('head').innerHTML = '<h1>查無此帳戶</h1>'; return; }
  const s = c.score, sig = c.signals, docs = c.docs;
  const pool = d.pool || { median: {} };
  const fin = c.industry === '金融保險', otc = c.market === '上櫃';
  document.title = `${c.name} ${c.code}｜企業雲端商機洞察平台`;
  Shell.setCrumbs([{ label: '總覽', href: 'index.html' }, { label: c.name + ' ' + c.code }]);
  const by = (type, cat) => sig.filter(x => x.type === type && (!cat || x.cat === cat));
  const rows = d.accounts.map(a => ({ code: a.code, name: a.name, industry: a.industry, need: Number(a.score.need) || 0, timing: Number(a.score.timing) || 0, play: a.score.play_primary }));
  const self = rows.find(r => r.code === code);

  document.getElementById('head').innerHTML = `
    <div><h1>${esc(c.name)} <span style="font-weight:400">${c.code}</span></h1>
      <div class="sub">${esc(c.full)}・${esc(c.industry)}・${c.market}・實收資本額 ${(c.capital / 1e8).toFixed(0)} 億元</div></div>
    <div class="tags">${tierBadge(String(s.tier))}
      <span class="badge cloud">${LABELS.cloud[s.cloud_status]}</span>
      <span class="badge cloud">資料完整度 ${Math.round(s.data_completeness * 100)}%</span></div>`;

  // ---------- A 分數摘要 ----------
  const maxOf = k => k === 'n4' && otc ? 15 : COMPONENTS.find(x => x.key === k).max;
  const compose = axis => {
    const parts = COMPONENTS.filter(x => x.axis === axis);
    const have = parts.filter(x => s[x.key] !== ''), miss = parts.filter(x => s[x.key] === '');
    const max = have.reduce((a, x) => a + maxOf(x.key), 0);
    return `<b>${axis === 'need' ? 'Need' : 'Timing'} ${fmt(s[axis])}</b>` +
      `= (${have.map(x => x.key.toUpperCase() + ' ' + fmt(s[x.key])).join(' + ')}) ÷ 可取得滿分 ${max} × 100` +
      (miss.length ? `<br><span class="muted">${miss.map(x => x.key.toUpperCase()).join('、')} 無資料，已移出分母</span>` : '');
  };
  AC.gauge(document.getElementById('g-need'), { value: s.need === '' ? null : Number(s.need), pct: s.need_pct === '' ? null : Number(s.need_pct), cut: pool.need_cut, tipHtml: compose('need') });
  AC.gauge(document.getElementById('g-timing'), { value: s.timing === '' ? null : Number(s.timing), pct: s.timing_pct === '' ? null : Number(s.timing_pct), cut: pool.timing_cut, tipHtml: compose('timing') });
  const over = (v, cut) => cut === null || cut === undefined ? '' : (Number(v) >= cut ? `✔ 過前 30% 門檻` : `差門檻 ${fmt(cut - Number(v))} 分`);
  document.getElementById('g-need-note').textContent = over(s.need, pool.need_cut);
  document.getElementById('g-timing-note').textContent = over(s.timing, pool.timing_cut);
  document.getElementById('q-title').textContent = '帳戶池位置';
  document.getElementById('q-note').textContent = LABELS.tierLong[String(s.tier)];
  // 黑色 Tier 主卡：帳戶池排名（Need＋Timing 總分，同分並列）
  const poolRank = s.pool_rank || (rows.slice().sort((a, b) => (b.need + b.timing) - (a.need + a.timing)).findIndex(r => r.code === code) + 1);
  const tierName = LABELS.tierLong[String(s.tier)];
  document.getElementById('tier-card').innerHTML = `
    <div class="tc-label">帳戶池排名</div>
    <div class="tc-rank">#${poolRank}</div>
    <div class="tc-tier">${esc(String(s.tier) === 'hold' ? '暫緩' : 'Tier ' + s.tier)}・共 ${rows.length} 家</div>
    <div class="tc-note">${esc(tierName.replace(/^Tier \d\s*/, ''))}${s.play_primary ? '・' + esc(s.play_primary) : ''}</div>`;
  AC.miniQuad(document.getElementById('mini-quad'), { rows, self, needCut: pool.need_cut ?? 50, timingCut: pool.timing_cut ?? 50,
    onClick: () => { location.href = 'index.html?focus=' + code; } });
  const peers = rows.filter(r => r.industry === c.industry);
  const drawRank = metric => {
    const rank = AC.lollipop(document.getElementById('rank'), { peers, selfCode: code, metric });
    document.getElementById('rank-title').textContent = `${c.industry} ${peers.length} 家中排第 ${rank}`;
    document.querySelectorAll('.seg-toggle button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.metric === metric)));
  };
  document.querySelectorAll('.seg-toggle button').forEach(b => b.addEventListener('click', () => drawRank(b.dataset.metric)));
  drawRank('need');

  // ---------- B 分數拆解（子彈圖＋帳戶池中位數） ----------
  const refs = list => {
    const uniq = [...new Set(list.map(x => x.ref))];
    return uniq.slice(0, 3).map(r => `<span class="ref" data-ref="${r}" tabindex="0">[${r}]</span>`).join('') +
      (uniq.length > 3 ? `<span class="more" data-tip="${uniq.slice(3).map(r => '[' + r + ']').join(' ')}" tabindex="0">＋${uniq.length - 3}</span>` : '');
  };
  const REASON = {
    D18: '台灣就業通公開職缺資料僅 1,000 筆且集中台北市，招募項目停用，移出分母（決策 D18）',
    D27: '金融保險業營收受投資收益波動，不代表擴張或降本，營收動能不納入計分（決策 D27）',
    D19: '櫃買中心沒有 ESG 資訊安全揭露，N4 的 ESG 子項移出分母（滿分改 15，決策 D19）'
  };
  const last12 = c.revenue.slice(-12);
  const docsOf = list => [...new Set(list.map(x => x.ref))].length;
  function line(k) {
    switch (k) {
      case 'n1': return last12.length >= 6 ? `近 12 月營收 ${Math.round(last12.reduce((a, r) => a + r[1], 0) / 1e5).toLocaleString()} 億，池內第 ${Math.round(Number(s.n1) / 25 * 100)} 百分位` : '月營收不足 6 個月，以實收資本額百分位代理';
      case 'n3': return docsOf(by('N3')) ? `近 365 天 ${docsOf(by('N3'))} 份文件命中遷移／數據／AI 字典` : '近 365 天沒有命中策略字典';
      case 'n4': {
        const p = [];
        if (fin) p.push('金融業基礎 10');
        if (by('N4', 'esg_breach').length) p.push('ESG 外洩 +10');
        if (by('N4', 'incident').length) p.push('資安事件重訊 +15');
        return p.length ? p.join('・') : (otc ? '無資安事件（上櫃無 ESG 揭露）' : '無 ESG 外洩、無資安事件重訊');
      }
      case 't1': { const n = docsOf(by('T1').filter(x => ageDays(x.at, d.generated_at) <= 90)); return n ? `近 90 天 ${n} 份觸發事件重訊` : '近 90 天沒有觸發事件'; }
      case 't2': { const e = by('T2'); return e.length ? e[0].title : '近 30 天命中新聞未達月均 1.5 倍'; }
      case 't3': { const e = by('T3'); return e.length ? e[0].title : '近 3 個月 YoY 未連續超過 ±15%'; }
    }
    return '';
  }
  const RULE = {
    n1: '近 12 個月營收在帳戶池內的百分位 × 25（無營收者以實收資本額代理）',
    n3: '近 365 天重訊＋新聞命中字典的文件數 n（強 1、弱 0.5），得分 25 × (1 − 0.5ⁿ)',
    n4: '金融業基礎 10；ESG 揭露外洩 > 0 加 10；近 365 天資安事件重訊加 15；上限 25',
    t1: '重訊主旨命中觸發事件，依類型給分 × 時間衰減（30 天內 ×1、31–90 天 ×0.5），上限 50',
    t2: '近 30 天命中新聞 ÷ 過去 90 天月均：≥ 2 倍滿分、≥ 1.5 倍一半（至少 2 則）',
    t3: '連 3 個月 YoY > +15% → 20（擴張）；< −15% → 15（降本）'
  };
  const evid = { n1: [], n3: by('N3'), n4: by('N4'), t1: by('T1').filter(x => ageDays(x.at, d.generated_at) <= 90), t2: by('T2'), t3: by('T3') };
  const bullet = x => {
    const v = s[x.key], miss = v === '', mx = maxOf(x.key), med = pool.median[x.key];
    const reason = x.key === 'n2' || x.key === 't4' ? 'D18' : x.key === 't3' && fin ? 'D27' : '';
    const medPct = med === null || med === undefined ? null : Math.min(100, med / mx * 100);
    return `<div class="bul">
      <div class="bul-name">${x.name}${x.key === 'n4' && otc ? ` <span class="code" data-tip="${esc(REASON.D19)}" tabindex="0">D19</span>` : ''}</div>
      <div class="bul-track${miss ? ' missing' : ''}" data-tip="${esc(miss ? REASON[reason] || '無資料' : RULE[x.key] || '')}">
        ${miss ? '' : `<i class="${med !== null && med !== undefined && Number(v) >= med ? 'over' : ''}" style="width:${Number(v) / mx * 100}%"></i>`}
        ${!miss && medPct !== null ? `<b class="med" style="left:${medPct}%"></b>` : ''}
      </div>
      <div class="bul-val">${miss ? `<span class="muted">無資料</span> <span class="code" data-tip="${esc(REASON[reason] || '')}" tabindex="0">${reason}</span>` : `<b>${fmt(v)}</b> <span class="muted">/ ${mx}</span>`}</div>
      <div class="bul-line">${miss ? '' : esc(line(x.key))} ${miss ? '' : refs(evid[x.key] || [])}${!miss && med !== null && med !== undefined ? `<span class="mid">中位 ${fmt(med)}</span>` : ''}</div>
    </div>`;
  };
  const axisCard = ax => `
    <div class="axis-title"><div><h2>${ax === 'need' ? 'Need 需求強度' : 'Timing 時機'}</h2></div>
      <span class="score">${fmt(s[ax])}<span class="muted" style="font-size:13px;font-weight:400"> / 100</span></span></div>
    ${COMPONENTS.filter(x => x.axis === ax).map(bullet).join('')}`;
  document.getElementById('b-need').innerHTML = axisCard('need');
  document.getElementById('b-timing').innerHTML = axisCard('timing');

  // ---------- C 泳道點圖 ----------
  const recent = docs.filter(x => ageDays(x.at, d.generated_at) <= 365);
  const t1n = docsOf(by('T1').filter(x => ageDays(x.at, d.generated_at) <= 30));
  document.getElementById('c-title').textContent = recent.length
    ? `近一年 ${recent.length} 份訊號${t1n ? `，近 30 天有 ${t1n} 份觸發事件` : ''}` : '近一年沒有訊號';
  AC.swimlane(document.getElementById('swim'), { docs: recent, refDate: d.generated_at, onPick: ref => pick(ref) });
  document.getElementById('swim-legend').innerHTML = ['Migration', 'Data', 'GenAI', 'Security'].map(p => `<span>${CL.shapeSvg(p, 11)}${LABELS.playShort[p]}</span>`).join('') +
    `<span><svg width="11" height="11" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4.5" fill="var(--white)" stroke="var(--ink-500)" stroke-width="1.5"/></svg>無 Play（營收、新聞量）</span>`;

  // ---------- D 營收管制圖 ----------
  const rv = c.revenue.slice(-15);
  document.getElementById('d-title').textContent = fin ? '金融業營收受投資收益影響，不納入計分（D27）'
    : s.t3 === '' ? '月營收不足 3 個月，營收動能無資料'
    : Number(s.t3) === 20 ? '連 3 月 YoY > +15% → T3 拿滿 20 分'
    : Number(s.t3) === 15 ? '連 3 月 YoY < −15% → T3 15 分（降本話術）'
    : '未連續超過 ±15% 門檻 → T3 0 分';
  AC.control(document.getElementById('control'), { rows: rv, applicable: !fin });

  // ---------- E Play 組成 ----------
  const ps = s.play_scores || null;
  if (ps) {
    const tot = Object.values(ps).reduce((a, b) => a + b, 0) || 1;
    const pc = p => Math.round(ps[p] / tot * 100);
    document.getElementById('e-title').textContent = `主 Play：${s.play_primary}（${pc(s.play_primary)}%）` + (s.play_secondary ? `・次 Play：${s.play_secondary}（${pc(s.play_secondary)}%）` : '・無次 Play');
    AC.playStack(document.getElementById('stack'), { scores: ps });
    document.getElementById('e-note').textContent = s.play_from_signals ? '' : '這家公司沒有帶 Play 的訊號，比例只來自產業先驗（P3 將改標「訊號不足」）。';
  } else document.getElementById('stack').innerHTML = '<p class="empty">Play 分數將於下次 API 更新後顯示</p>';

  // ---------- F 訊號清單 ----------
  const byPts = docs.slice().sort((a, b) => b.points - a.points || String(b.at).localeCompare(String(a.at)));
  let expanded = false;
  const SRC = { ann: '重大訊息', news: '新聞', esg: 'ESG 報告', revenue: '月營收' };
  function renderList() {
    const list = expanded ? byPts : byPts.slice(0, 5);
    document.getElementById('f-hint').textContent = `依得分排序・${expanded ? '全部' : '前 5'} / ${docs.length} 份`;
    document.getElementById('siglist').innerHTML = list.length ? list.map(x => {
      const ext = x.url && x.url[0] !== '#';
      const label = x.src === 'ann' ? `${esc(x.title)}<span class="muted" style="font-size:12px">（公開資訊觀測站當月重訊）</span>` : esc(x.title);
      const title = x.url ? `<a href="${esc(x.url)}"${ext ? ' target="_blank" rel="noopener"' : ''}>${label}</a>` : label;
      return `<li id="${x.ref}" data-ref="${x.ref}"><span class="pdot">${x.play && CL.PLAY_SHAPE[x.play] ? CL.shapeSvg(x.play, 10) : '<svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="var(--white)" stroke="var(--ink-500)" stroke-width="1.5"/></svg>'}</span>
        <span class="sid">${x.ref}</span><span class="date">${String(x.at).slice(0, 10)}</span><span class="type">${SRC[x.src] || x.src}</span>
        <span>${title}<br><span class="kinds">${x.kinds.join('　')}・得分 ${fmt(x.points)}</span></span></li>`;
    }).join('') : '<li class="muted">沒有訊號</li>';
    const btn = document.getElementById('toggle-all');
    btn.hidden = docs.length <= 5;
    btn.textContent = expanded ? '收合' : `顯示全部 ${docs.length} 則`;
    hookRefs(document.getElementById('siglist'));
  }
  document.getElementById('toggle-all').addEventListener('click', () => { expanded = !expanded; renderList(); });

  // [S#] 互動：hover 高亮、點擊捲到清單（清單收合時自動展開）
  const setOn = (ref, on) => document.querySelectorAll(`[data-ref="${ref}"]`).forEach(n => n.classList.toggle('on', on));
  // 同步高亮泳道圖上對應的點（放大並加外框）
  const swimPt = (ref, on) => document.querySelectorAll(`#swim [data-pt="${ref}"]`).forEach(n => n.classList.toggle('pt-on', on));
  function pick(ref) {
    if (!document.getElementById(ref)) { expanded = true; renderList(); }
    const t = document.getElementById(ref);
    if (!t) return;
    document.querySelectorAll('.siglist li.picked').forEach(n => n.classList.remove('picked'));
    t.classList.add('picked');
    t.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function hookRefs(scope) {
    scope.querySelectorAll('[data-ref]').forEach(n => {
      if (n.__hooked) return; n.__hooked = true;
      n.addEventListener('mouseenter', () => { setOn(n.dataset.ref, true); swimPt(n.dataset.ref, true); });
      n.addEventListener('mouseleave', () => { setOn(n.dataset.ref, false); swimPt(n.dataset.ref, false); });
    });
    scope.querySelectorAll('.ref').forEach(n => {
      if (n.__click) return; n.__click = true;
      n.addEventListener('click', () => pick(n.dataset.ref));
      n.addEventListener('keydown', e => { if (e.key === 'Enter') pick(n.dataset.ref); });
    });
  }
  renderList();
  hookRefs(document);
  AC.bindTips(document.getElementById('b-need'));
  AC.bindTips(document.getElementById('b-timing'));
  Copilot.mount(document.getElementById('copilot'), c.code, hookRefs);
})();
</script>
</body>
</html>
