<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資料狀態｜企業雲端商機洞察平台</title>
<meta name="description" content="各資料來源的最後成功時間、本週筆數、近 8 週趨勢與最近錯誤">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=20261019b">
<link rel="stylesheet" href="css/app.css?v=20261019h">
</head>
<body data-page="status" data-title="資料狀態">
<main>
  <p class="status-lead" id="lead">載入中…</p>

  <section class="src-grid" id="cards" aria-label="資料來源狀態"></section>

  <section class="card" aria-labelledby="err-title">
    <div class="card-head"><h2 id="err-title">最近 10 筆錯誤</h2><span class="hint" id="err-hint"></span></div>
    <div class="card-body">
      <div class="table-wrap">
        <table>
          <thead><tr><th class="plain">時間</th><th class="plain">步驟</th><th class="plain">狀態</th><th class="plain">錯誤訊息</th></tr></thead>
          <tbody id="errors"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="card" style="margin-top:20px" aria-labelledby="sch-title">
    <div class="card-head"><h2 id="sch-title">排程與資料庫</h2></div>
    <div class="card-body two-col">
      <ul class="sch-list" id="schedule"></ul>
      <div class="sch-tables" id="tables"></div>
    </div>
  </section>
</main>

<script src="js/api.js?v=20261019b"></script>
<script src="js/shell.js?v=20261019e"></script>
<script>
(async () => {
  const { esc } = CL;
  let st;
  try { st = (await CL.gas('status', {}, 60000)).data; }
  catch (e) { document.getElementById('lead').textContent = '目前無法連線後端：' + e.message; return; }

  const STATE = {
    ok: { cls: 'ok', icon: '✓', text: '正常' },
    error: { cls: 'err', icon: '✕', text: '失敗' },
    stale: { cls: 'stale', icon: '!', text: '資料過期' }
  };
  const cards = st.cards || [];
  const bad = cards.filter(c => c.state === 'error').length, stale = cards.filter(c => c.state === 'stale').length;
  document.getElementById('lead').textContent = bad || stale
    ? `${cards.length} 個來源中 ${cards.length - bad - stale} 個正常${bad ? `、${bad} 個有失敗步驟（每日排程會自動重試）` : ''}${stale ? `、${stale} 個資料過期` : ''}。`
    : `${cards.length} 個來源全部正常。`;

  const when = iso => iso ? String(iso).replace('T', ' ').slice(5, 16) : '—';
  const bf = st.backfill && st.backfill.announcements;
  document.getElementById('cards').innerHTML = cards.map(c => {
    const s = STATE[c.state] || STATE.ok;
    const extra = c.key === 'annhist' && bf
      ? `<div class="src-extra">已回補 <b>${bf.done_days}</b> / ${bf.total_days} 天<div class="progress"><i style="width:${bf.done_days / bf.total_days * 100}%"></i></div></div>`
      : c.key === 'news' && st.backfill ? `<div class="src-extra">已完成首次回補 <b>${st.backfill.news_companies}</b> 家</div>` : '';
    const err = c.error_count ? `<div class="src-err">${c.error_count} 個步驟失敗：${c.error_steps.map(esc).join('、')}</div>` : '';
    return `<article class="card src-card" data-state="${c.state}">
      <div class="src-top"><div><h2>${esc(c.name)}</h2><span class="src-from">${esc(c.src)}</span></div>
        <span class="st st-${s.cls}"><span aria-hidden="true">${s.icon}</span>${s.text}</span></div>
      <div class="src-num"><span class="stat-num">${Number(c.this_week).toLocaleString()}</span><span class="src-unit">${esc(c.unit)}</span></div>
      <div class="src-foot">上次成功：${when(c.last_success_at)}</div>${extra}${err}</article>`;
  }).join('');

  // 最近 10 筆錯誤
  const errs = st.recent_errors || [];
  document.getElementById('err-hint').textContent = errs.length ? `${errs.filter(e => !e.resolved).length} 筆待重試、${errs.filter(e => e.resolved).length} 筆已恢復` : '';
  document.getElementById('errors').innerHTML = errs.length ? errs.map(e => `<tr>
      <td>${when(e.at)}</td><td><code>${esc(e.step)}</code></td>
      <td><span class="st ${e.resolved ? 'st-ok' : 'st-err'}"><span aria-hidden="true">${e.resolved ? '✓' : '✕'}</span>${e.resolved ? '已恢復' : '待重試'}</span></td>
      <td class="err">${esc(String(e.message).slice(0, 90))}${String(e.message).length > 90 ? '…' : ''}</td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">目前沒有錯誤紀錄</td></tr>';

  // 排程與資料庫
  const jobsRunning = (st.jobs || []).filter(j => j.in_progress).map(j => `${j.job}（${j.checkpoint}）`);
  document.getElementById('schedule').innerHTML = (st.schedule || []).map(s => `<li>${esc(s)}</li>`).join('') +
    '';
  const names = { companies: '公司主檔', company_aliases: '公司別名', raw_announcements: '重大訊息', raw_revenue: '月營收', raw_news: '新聞',
    raw_esg_security: 'ESG 資安', signals: '訊號', scores: '分數（含歷史）', config_keywords: '關鍵字字典', run_log: '執行紀錄', mail_log: '告警信紀錄' };
  document.getElementById('tables').innerHTML = `<div class="tbl-grid">${Object.entries(st.tables).map(([k, v]) =>
    `<div class="tbl-item"><span>${names[k] || k}</span><b class="stat-num">${Number(v).toLocaleString()}</b></div>`).join('')}</div>`;
})();
</script>
</body>
</html>
